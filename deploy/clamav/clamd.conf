Foreground yes
LogTime yes
LogClean no
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
MaxThreads 2
MaxQueue 8
StreamMaxLength 10M
MaxScanSize 30M
MaxFileSize 10M
MaxRecursion 16
MaxFiles 200
AlertEncrypted yes
AlertExceedsMax yes
ConcurrentDatabaseReload no
FailIfCvdOlderThan 7
