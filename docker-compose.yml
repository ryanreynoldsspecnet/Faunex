services:
  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    mem_limit: 4g
    cpus: 1.5
    entrypoint: ["/bin/sh", "-c", "cp /run/faunex/clamd.conf /etc/clamav/clamd.conf && exec /init"]
    volumes:
      - ./deploy/clamav:/run/faunex:ro
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd.conf", "--ping=1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
  caddy:
    image: caddy:2-alpine
    container_name: faunex-caddy
    restart: unless-stopped
    environment:
      FAUNEX_PAYMENTS_INGRESS_TOKEN: ${FAUNEX_PAYMENTS_INGRESS_TOKEN:-disabled}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      faunex-web:
        condition: service_healthy

  faunex-api:
    image: faunex-api:${FAUNEX_RELEASE:-current}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Faunex.Api/Dockerfile
      args:
        RELEASE_REVISION: ${FAUNEX_RELEASE:-development}
    container_name: faunex-api
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${FAUNEX_CONNECTIONSTRING}
      FAUNEX_JWT_ISSUER: ${FAUNEX_JWT_ISSUER}
      FAUNEX_JWT_AUDIENCE: ${FAUNEX_JWT_AUDIENCE}
      FAUNEX_JWT_SIGNING_KEY: ${FAUNEX_JWT_SIGNING_KEY}
      FAUNEX_SUPERADMIN_PASSWORD: ${FAUNEX_SUPERADMIN_PASSWORD}
      FAUNEX_PUBLIC_BASE_URL: ${FAUNEX_PUBLIC_BASE_URL}
      FAUNEX_EMAIL_SMTP_HOST: ${FAUNEX_EMAIL_SMTP_HOST}
      FAUNEX_EMAIL_SMTP_PORT: ${FAUNEX_EMAIL_SMTP_PORT}
      FAUNEX_EMAIL_SMTP_USERNAME: ${FAUNEX_EMAIL_SMTP_USERNAME}
      FAUNEX_EMAIL_SMTP_PASSWORD: ${FAUNEX_EMAIL_SMTP_PASSWORD}
      FAUNEX_EMAIL_SMTP_ENABLE_SSL: ${FAUNEX_EMAIL_SMTP_ENABLE_SSL}
      FAUNEX_EMAIL_FROM_EMAIL: ${FAUNEX_EMAIL_FROM_EMAIL}
      FAUNEX_EMAIL_FROM_NAME: ${FAUNEX_EMAIL_FROM_NAME}
      Files__RootPath: /var/lib/faunex/listing-files
      Files__ScannerHost: clamav
      Payments__SandboxEnabled: ${FAUNEX_PAYFAST_SANDBOX_ENABLED:-false}
      Payments__IngressToken: ${FAUNEX_PAYMENTS_INGRESS_TOKEN:-}
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - listing_files:/var/lib/faunex/listing-files
      - payment_keys:/var/lib/faunex/payment-keys
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "8", "http://localhost:8080/api/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  faunex-web:
    image: faunex-web:${FAUNEX_RELEASE:-current}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Faunex.Web/Dockerfile
      args:
        RELEASE_REVISION: ${FAUNEX_RELEASE:-development}
    container_name: faunex-web
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://faunex-api:8080
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      faunex-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "8", "-H", "Host: faunex.co.za", "http://localhost:8080/__ready"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  db:
    image: postgres:16
    restart: unless-stopped
    container_name: faunex-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  dataprotection_keys:
  caddy_data:
  caddy_config:
  listing_files:
  clamav_data:
  payment_keys:
