name: Faunex Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: faunex-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FAUNEX_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=faunex-test-only
      FAUNEX_TEST_CLAMAV: '127.0.0.1:3310'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Faunex.slnx

      - name: Start isolated upload scanner
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name faunex-test-clamav --memory=4g --cpus=1.5 \
            -p 127.0.0.1:3310:3310 -v "$PWD/deploy/clamav:/run/faunex:ro" \
            --entrypoint /bin/sh clamav/clamav:1.5.4-debian \
            -c 'cp /run/faunex/clamd.conf /etc/clamav/clamd.conf && exec /init'
          for attempt in $(seq 1 60); do
            if docker exec faunex-test-clamav clamdscan --config-file=/etc/clamav/clamd.conf --ping=1; then exit 0; fi
            sleep 5
          done
          docker logs faunex-test-clamav
          exit 1

      - name: Validate Caddy configuration
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Check vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet list Faunex.slnx package --include-transitive --vulnerable)"
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "Vulnerable packages were detected. Deployment blocked."
            exit 1
          fi

      - name: Build
        run: dotnet build Faunex.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Faunex.slnx --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish Faunex.Api/Faunex.Api.csproj --configuration Release --no-build --output ./artifacts/api

      - name: Publish Web
        run: dotnet publish Faunex.Web/Faunex.Web.csproj --configuration Release --no-build --output ./artifacts/web -p:StaticWebAssetsMode=Publish

      - name: Scanner diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          docker logs --tail 60 faunex-test-clamav || true
          docker rm -f faunex-test-clamav || true

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH (decode key)
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode the key from base64 (avoids newline/format corruption)
          echo "${{ secrets.FAUNEX_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Prove it's a real key (safe)
          ssh-keygen -lf ~/.ssh/id_ed25519

          # Add server host key
          ssh-keyscan -H "${{ secrets.FAUNEX_SERVER_IP }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH handshake test
        shell: bash
        run: |
          set -euxo pipefail
          ssh -vvv \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@${{ secrets.FAUNEX_SERVER_IP }} \
            "echo 'SSH OK FROM ACTIONS'"

      - name: Deploy
        shell: bash
        run: |
          set -euxo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@${{ secrets.FAUNEX_SERVER_IP }} \
            'cd /home/ubuntu/faunex &&
             git pull origin master &&
             docker compose up -d --build --remove-orphans &&
             docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile'
